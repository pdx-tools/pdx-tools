name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-devcontainer:
    runs-on: ${{ matrix.runner }}
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    name: devcontainer / build / ${{ matrix.arch }}
    env:
      DEVCONTAINER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Dev Container image
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/pdx-tools/devcontainer
        imageTag: sha-${{ env.DEVCONTAINER_SHA }}-${{ matrix.arch }}
        cacheFrom: ghcr.io/pdx-tools/devcontainer
        platform: ${{ matrix.platform }}
        push: always

  test-devcontainer:
    runs-on: ${{ matrix.runner }}
    needs: build-devcontainer
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test'))
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
            with_tokens: false
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
            with_tokens: true
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
            with_tokens: false
    name: devcontainer / test / ${{ matrix.arch }} / tokens-${{ matrix.with_tokens && 'included' || 'absent' }}
    env:
      ASSET_CACHE_PATHS: |
        assets/game-bundles
      PDX_FIXTURES_LOG: ${{ github.workspace }}/fixtures.log
      DEVCONTAINER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
    - name: Remove unwanted software
      if: matrix.arch == 'amd64'
      run: |
        echo "before"
        df -h
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        echo "after"
        df -h

    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Restore the newest asset cache by prefix. This job only restores.
    - name: Restore assets
      if: matrix.arch == 'amd64'
      uses: actions/cache/restore@v6
      with:
        path: ${{ env.ASSET_CACHE_PATHS }}
        key: asset-cache-v3-
        restore-keys: asset-cache-v3-
        enableCrossOsArchive: true # shares one cache with the build job

    - name: Restore EU4 save fixtures
      if: matrix.arch == 'amd64' && matrix.with_tokens
      uses: actions/cache/restore@v6
      with:
        path: assets/saves/eu4
        key: save-fixtures-v1-eu4-${{ hashFiles('src/eu4game/tests/it/fixtures.txt') }}
        restore-keys: save-fixtures-v1-eu4-
        enableCrossOsArchive: true

    - name: Restore EU5 save fixtures
      if: matrix.arch == 'amd64' && matrix.with_tokens
      uses: actions/cache/restore@v6
      with:
        path: assets/saves/eu5
        key: save-fixtures-v1-eu5-${{ hashFiles('src/eu5app/tests/it/fixtures.txt') }}
        restore-keys: save-fixtures-v1-eu5-
        enableCrossOsArchive: true

    - uses: actions/checkout@v7
      name: Clone tokens
      if: matrix.with_tokens
      with:
        path: assets/tokens
        repository: pdx-tools/tokens
        token: ${{secrets.GH_PAT}}

    - name: Link tokens
      if: matrix.with_tokens
      run: cd assets/tokens && ln -s tokens/* .

    - name: Run Dev Container validation
      uses: devcontainers/ci@v0.3
      env:
        ASSETS_ACCESS_KEY: ${{ secrets.ASSETS_ACCESS_KEY }}
        ASSETS_SECRET_KEY: ${{ secrets.ASSETS_SECRET_KEY }}
        GH_PAT: ${{ secrets.GH_PAT }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        imageName: ghcr.io/pdx-tools/devcontainer
        imageTag: sha-${{ env.DEVCONTAINER_SHA }}-${{ matrix.arch }}
        cacheFrom: ghcr.io/pdx-tools/devcontainer:sha-${{ env.DEVCONTAINER_SHA }}-${{ matrix.arch }}
        platform: ${{ matrix.platform }}
        push: never
        env: |
          ASSETS_ACCESS_KEY
          ASSETS_SECRET_KEY
          CI
          GITHUB_TOKEN
        runCmd: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            mise install --verbose --jobs 1
            mise --version
            mise exec -- rustc --version
            mise exec -- pnpm --version
            steamcmd 2>&1 | grep -F "steamcmd is only installed in the amd64 devcontainer image."
          else
            # The host path in PDX_FIXTURES_LOG does not exist in the
            # container; the checkout is bind-mounted at the current directory.
            export PDX_FIXTURES_LOG="$PWD/fixtures.log"
            mise run admin:assets:sync && \
            mise run admin:assets:compile:all && \
            mise run ${{ matrix.with_tokens && 'test:cargo' || 'test:wasm' }}
            ${{ matrix.with_tokens && 'mise run test:app ::: typecheck' || '' }}
            mise run build:app
          fi

    - name: Check fixture lists
      if: matrix.arch == 'amd64' && matrix.with_tokens
      shell: bash
      run: |
        for fixture in "eu4 src/eu4game/tests/it/fixtures.txt" "eu5 src/eu5app/tests/it/fixtures.txt"; do
          game=${fixture%% *}
          file=${fixture#* }
          actual=$(mktemp)
          awk -F/ -v game="$game" '$1 == game { print $2 }' "$PDX_FIXTURES_LOG" | LC_ALL=C sort -u > "$actual"
          unexpected=$(comm -23 "$actual" <(LC_ALL=C sort "$file"))
          rm -f "$actual"
          if [ -n "$unexpected" ]; then
            echo "Fixtures used by $game are missing from $file:"
            echo "$unexpected"
            exit 1
          fi
        done

  devcontainer-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-devcontainer
    name: devcontainer / publish
    permissions:
      contents: read
      packages: write
    env:
      DEVCONTAINER_SHA: ${{ github.sha }}
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Publish Dev Container image
      run: |
        docker buildx imagetools create \
          -t ghcr.io/pdx-tools/devcontainer:latest \
          ghcr.io/pdx-tools/devcontainer:sha-${DEVCONTAINER_SHA}-amd64 \
          ghcr.io/pdx-tools/devcontainer:sha-${DEVCONTAINER_SHA}-arm64

  devcontainer-cleanup:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'schedule'
    needs: test-devcontainer
    name: devcontainer / cleanup
    permissions:
      packages: write
    steps:
    - name: Delete old Dev Container package versions
      uses: actions/delete-package-versions@v5
      with:
        package-name: devcontainer
        package-type: container
        min-versions-to-keep: 80
        ignore-versions: '^latest$'

  build:
    runs-on: ${{ matrix.os }}
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            with_tokens: false
          - os: ubuntu-latest
            with_tokens: true
          - os: windows-latest
            with_tokens: false
          - os: windows-latest
            with_tokens: true
          - os: macos-15
            with_tokens: false # docker not supported on macos gh actions
    name: build / ${{ matrix.os }} / tokens-${{ matrix.with_tokens && 'included' || 'absent' }}
    env:
      ASSET_CACHE_PATHS: |
        assets/game-bundles
      PDX_FIXTURES_LOG: ${{ github.workspace }}/fixtures.log
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # See the note on the devcontainer job's restore step.
      - name: Restore assets
        uses: actions/cache/restore@v6
        with:
          key: asset-cache-v3-
          restore-keys: asset-cache-v3-
          enableCrossOsArchive: true # shared cache between OSes
          path: ${{ env.ASSET_CACHE_PATHS }}

      - name: Restore EU4 save fixtures
        id: eu4-fixtures
        if: matrix.with_tokens
        uses: actions/cache/restore@v6
        with:
          path: assets/saves/eu4
          key: save-fixtures-v1-eu4-${{ hashFiles('src/eu4game/tests/it/fixtures.txt') }}
          restore-keys: save-fixtures-v1-eu4-
          enableCrossOsArchive: true

      - name: Restore EU5 save fixtures
        id: eu5-fixtures
        if: matrix.with_tokens
        uses: actions/cache/restore@v6
        with:
          path: assets/saves/eu5
          key: save-fixtures-v1-eu5-${{ hashFiles('src/eu5app/tests/it/fixtures.txt') }}
          restore-keys: save-fixtures-v1-eu5-
          enableCrossOsArchive: true

      - uses: actions/checkout@v7
        name: Clone tokens
        if: matrix.with_tokens
        with:
          path: assets/tokens
          repository: pdx-tools/tokens
          token: ${{secrets.GH_PAT}}

      - name: Link tokens
        if: matrix.with_tokens
        run: cd assets/tokens && ln -s tokens/* .

      - uses: jdx/mise-action@v4
        with:
          version: 2026.4.5
          cache: false

      # Trial out rust caching with the slowest run:
      - name: Cache Rust dependencies
        if: matrix.os == 'windows-latest' && matrix.with_tokens
        uses: Swatinem/rust-cache@v2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    
      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store
  
      - name: Asset pipeline
        if: matrix.with_tokens # if tokens are enabled, process game bundles
        env:
          ASSETS_ACCESS_KEY: ${{ matrix.with_tokens && secrets.ASSETS_ACCESS_KEY || '' }}
          ASSETS_SECRET_KEY: ${{ matrix.with_tokens && secrets.ASSETS_SECRET_KEY || '' }}
        run: |
          mise run admin:assets:sync
          mise run admin:assets:compile:all
      - run: |
          mise run ${{ matrix.with_tokens && 'test:cargo' || 'test:wasm' }}
          ${{ matrix.with_tokens && 'mise run test:app ::: typecheck' || '' }}
          mise run build:app

      - name: Check fixture lists
        if: matrix.os == 'ubuntu-latest' && matrix.with_tokens
        shell: bash
        run: |
          for fixture in "eu4 src/eu4game/tests/it/fixtures.txt" "eu5 src/eu5app/tests/it/fixtures.txt"; do
            game=${fixture%% *}
            file=${fixture#* }
            actual=$(mktemp)
            awk -F/ -v game="$game" '$1 == game { print $2 }' "$PDX_FIXTURES_LOG" | LC_ALL=C sort -u > "$actual"
            unexpected=$(comm -23 "$actual" <(LC_ALL=C sort "$file"))
            rm -f "$actual"
            if [ -n "$unexpected" ]; then
              echo "Fixtures used by $game are missing from $file:"
              echo "$unexpected"
              exit 1
            fi
          done

      - name: Save EU4 save fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.with_tokens && steps.eu4-fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: assets/saves/eu4
          key: save-fixtures-v1-eu4-${{ hashFiles('src/eu4game/tests/it/fixtures.txt') }}
          enableCrossOsArchive: true

      - name: Save EU5 save fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.with_tokens && steps.eu5-fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: assets/saves/eu5
          key: save-fixtures-v1-eu5-${{ hashFiles('src/eu5app/tests/it/fixtures.txt') }}
          enableCrossOsArchive: true

      # The one saver. Keyed on the directory listing, so a new entry is
      # written only when this run fetched a fixture the cache lacked; a
      # literal key never re-saves after the first hit. Only a tokens leg
      # has game-bundles, so a token-less leg must never save.
      - name: Hash asset listing
        id: assets
        if: always() && matrix.os == 'ubuntu-latest' && matrix.with_tokens
        shell: bash
        run: |
          hash=$(find $ASSET_CACHE_PATHS -type f 2>/dev/null | LC_ALL=C sort | sha256sum | cut -c1-16)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Save assets
        if: always() && matrix.os == 'ubuntu-latest' && matrix.with_tokens
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ASSET_CACHE_PATHS }}
          key: asset-cache-v3-${{ steps.assets.outputs.hash }}
          enableCrossOsArchive: true
