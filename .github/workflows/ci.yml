name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]
  schedule:
    - cron: '0 2 * * *'

jobs:
  build-devcontainer:
    runs-on: ${{ matrix.runner }}
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    name: devcontainer / build / ${{ matrix.arch }}
    env:
      DEVCONTAINER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Dev Container image
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/pdx-tools/devcontainer
        imageTag: sha-${{ env.DEVCONTAINER_SHA }}-${{ matrix.arch }}
        cacheFrom: ghcr.io/pdx-tools/devcontainer
        platform: ${{ matrix.platform }}
        push: always

  test-devcontainer:
    runs-on: ${{ matrix.runner }}
    needs: build-devcontainer
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test'))
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    # A smoke test. It checks that the toolchain in the image compiles the
    # code, but it does not build or test it. The build job runs the full
    # test suites.
    name: devcontainer / test / ${{ matrix.arch }}
    env:
      DEVCONTAINER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        ref: ${{ github.event.pull_request.head.sha || github.sha }}

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Run Dev Container validation
      uses: devcontainers/ci@v0.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        imageName: ghcr.io/pdx-tools/devcontainer
        imageTag: sha-${{ env.DEVCONTAINER_SHA }}-${{ matrix.arch }}
        cacheFrom: ghcr.io/pdx-tools/devcontainer:sha-${{ env.DEVCONTAINER_SHA }}-${{ matrix.arch }}
        platform: ${{ matrix.platform }}
        push: never
        env: |
          CI
          GITHUB_TOKEN
        runCmd: |
          set -e
          mise install --verbose --jobs 1
          mise --version
          mise exec -- rustc --version
          mise exec -- pnpm --version
          # The build scripts run during a check, so this also compiles the
          # flatbuffers schema and the zstd C sources for wasm.
          mise run tokenize
          mise exec -- cargo check --workspace --exclude 'wasm-*'
          mise run setup:wasm
          mise exec -- cargo check --release --target wasm32-unknown-unknown -p 'wasm-*' \
            --no-default-features --features zstd_c_fat_lto --features zstd_c
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            steamcmd 2>&1 | grep -F "steamcmd is only installed in the amd64 devcontainer image."
          else
            # Start the test services with Docker in Docker and apply the
            # migrations.
            mise run start:services:test -d
          fi

  devcontainer-publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test-devcontainer
    name: devcontainer / publish
    permissions:
      contents: read
      packages: write
    env:
      DEVCONTAINER_SHA: ${{ github.sha }}
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Publish Dev Container image
      run: |
        docker buildx imagetools create \
          -t ghcr.io/pdx-tools/devcontainer:latest \
          ghcr.io/pdx-tools/devcontainer:sha-${DEVCONTAINER_SHA}-amd64 \
          ghcr.io/pdx-tools/devcontainer:sha-${DEVCONTAINER_SHA}-arm64

  devcontainer-cleanup:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'schedule'
    needs: test-devcontainer
    name: devcontainer / cleanup
    permissions:
      packages: write
    steps:
    - name: Delete old Dev Container package versions
      uses: actions/delete-package-versions@v5
      with:
        package-name: devcontainer
        package-type: container
        min-versions-to-keep: 80
        ignore-versions: '^latest$'

  build:
    runs-on: ${{ matrix.os }}
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'safe to test'))
    strategy:
      fail-fast: false
      matrix:
        # The "no-tokens" suite checks the build without tokens. The
        # "rust-tests" and "app-tests" suites need tokens. They use different
        # cargo profiles, so they share few build artifacts and run as
        # parallel jobs.
        include:
          - os: ubuntu-latest
            suite: no-tokens
            with_tokens: false
          - os: ubuntu-latest
            suite: rust-tests
            with_tokens: true
          - os: ubuntu-latest
            suite: app-tests
            with_tokens: true
          - os: windows-latest
            suite: rust-tests
            with_tokens: true
          - os: windows-latest
            suite: app-tests
            with_tokens: true
          - os: macos-15
            suite: no-tokens # docker not supported on macos gh actions
            with_tokens: false
    name: build / ${{ matrix.os }} / ${{ matrix.suite }}
    env:
      ASSET_CACHE_PATHS: |
        assets/game-bundles
      PDX_FIXTURES_LOG: ${{ github.workspace }}/fixtures.log
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      # Releases are not built on Windows, so CI on Windows uses a release
      # profile that compiles faster.
      - name: Relax the release profile on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "CARGO_PROFILE_RELEASE_LTO=false" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16" >> "$GITHUB_ENV"
      # Restore the bundle cache for this manifest, or the newest one. The
      # sync step then downloads only what the cache lacks.
      - name: Restore assets
        id: bundles
        uses: actions/cache/restore@v6
        with:
          key: game-bundles-v2-${{ hashFiles('assets/catalog.json') }}
          restore-keys: game-bundles-v2-
          enableCrossOsArchive: true # shared cache between OSes
          path: ${{ env.ASSET_CACHE_PATHS }}

      - name: Restore EU4 save fixtures
        id: eu4-fixtures
        if: matrix.with_tokens
        uses: actions/cache/restore@v6
        with:
          path: assets/saves/eu4
          key: save-fixtures-v1-eu4-${{ hashFiles('src/eu4game/tests/it/fixtures.txt') }}
          restore-keys: save-fixtures-v1-eu4-
          enableCrossOsArchive: true

      - name: Restore EU5 save fixtures
        id: eu5-fixtures
        if: matrix.with_tokens
        uses: actions/cache/restore@v6
        with:
          path: assets/saves/eu5
          key: save-fixtures-v1-eu5-${{ hashFiles('src/eu5app/tests/it/fixtures.txt') }}
          restore-keys: save-fixtures-v1-eu5-
          enableCrossOsArchive: true

      - uses: actions/checkout@v7
        name: Clone tokens
        if: matrix.with_tokens
        with:
          path: assets/tokens
          repository: pdx-tools/tokens
          token: ${{secrets.GH_PAT}}

      - name: Link tokens
        if: matrix.with_tokens
        run: cd assets/tokens && ln -s tokens/* .

      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.17
          cache: false

      # Only the slow suites use the cache, and only master saves it. A save
      # from each pull request would make the job longer and push the master
      # entries out of the repository cache limit.
      - name: Cache Rust dependencies
        if: matrix.with_tokens
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
    
      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store

      - name: Start PostgreSQL on Windows
        if: matrix.os == 'windows-latest' && matrix.suite == 'app-tests'
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: root
        run: |
          source src/app/.env.test
          source dev/.env.test
          export PGPORT="$DATABASE_PORT"
          export DATABASE_APP_USER="$DATABASE_USER" DATABASE_APP_USER_PASSWORD="$DATABASE_PASSWORD"
          "$PGBIN/pg_ctl.exe" -D "$PGDATA" -o "-p $PGPORT" -l "$RUNNER_TEMP/postgres.log" -w start
          psql() { "$PGBIN/psql.exe" -v ON_ERROR_STOP=1 "$@"; }
          source dev/sql/init-db.sh
          echo "DATABASE_ADMIN_PASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"
          echo "PDX_TEST_DATABASE_EXTERNAL=1" >> "$GITHUB_ENV"
  
      - name: Asset pipeline
        id: asset-pipeline
        if: matrix.with_tokens # if tokens are enabled, process game bundles
        env:
          ASSETS_ACCESS_KEY: ${{ matrix.with_tokens && secrets.ASSETS_ACCESS_KEY || '' }}
          ASSETS_SECRET_KEY: ${{ matrix.with_tokens && secrets.ASSETS_SECRET_KEY || '' }}
        run: |
          mise run admin:assets:sync
          mise run admin:assets:compile:all
      - name: Install browser dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'app-tests'
        run: |
          mise run pnpm-install
          pnpm --dir src/app exec playwright install --with-deps chromium

      # Bash on every OS: a multi-line PowerShell script reports only the
      # exit code of its last command, so a failed test passed on Windows.
      - shell: bash
        env:
          PDX_REQUIRE_TEST_ASSETS: ${{ matrix.with_tokens && '1' || '0' }}
        run: |
          case "${{ matrix.suite }}" in
            no-tokens) mise run test:wasm; mise run build:app ;;
            rust-tests) mise run test:cargo ;;
            app-tests) mise run test:app; mise run build:app ::: typecheck ;;
          esac

      - name: Upload browser test report
        if: failure() && matrix.suite == 'app-tests'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            src/app/playwright-report
            src/app/test-results
          retention-days: 7

      - name: Check fixture lists
        if: matrix.os == 'ubuntu-latest' && matrix.with_tokens
        shell: bash
        run: |
          for fixture in "eu4 src/eu4game/tests/it/fixtures.txt" "eu5 src/eu5app/tests/it/fixtures.txt"; do
            game=${fixture%% *}
            file=${fixture#* }
            actual=$(mktemp)
            awk -F/ -v game="$game" '$1 == game { print $2 }' "$PDX_FIXTURES_LOG" | LC_ALL=C sort -u > "$actual"
            unexpected=$(comm -23 "$actual" <(LC_ALL=C sort "$file"))
            rm -f "$actual"
            if [ -n "$unexpected" ]; then
              echo "Fixtures used by $game are missing from $file:"
              echo "$unexpected"
              exit 1
            fi
          done

      - name: Save EU4 save fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'rust-tests' && steps.eu4-fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: assets/saves/eu4
          key: save-fixtures-v1-eu4-${{ hashFiles('src/eu4game/tests/it/fixtures.txt') }}
          enableCrossOsArchive: true

      - name: Save EU5 save fixtures
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'rust-tests' && steps.eu5-fixtures.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: assets/saves/eu5
          key: save-fixtures-v1-eu5-${{ hashFiles('src/eu5app/tests/it/fixtures.txt') }}
          enableCrossOsArchive: true

      # The one saver. The key is the manifest hash, so a new entry is
      # saved only when the manifest changes. Save even when the tests
      # fail, but only after a complete sync.
      - name: Save assets
        if: |
          !cancelled() && matrix.os == 'ubuntu-latest' && matrix.suite == 'rust-tests' &&
          steps.asset-pipeline.outcome == 'success' && steps.bundles.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ASSET_CACHE_PATHS }}
          key: game-bundles-v2-${{ hashFiles('assets/catalog.json') }}
          enableCrossOsArchive: true
