# The processes of the development stack. Start it with `mise run dev`, which
# prepares the build artifacts first.
#
# The stack is all-or-nothing: when a long-running process stops, or a setup
# step fails, process-compose stops all of the other processes.
version: "0.5"
ordered_shutdown: true

processes:
  db:
    # PostgreSQL runs in the background, so a command stops it. The start also
    # applies the migrations.
    command: node ./dev/scripts/services.mts start
    is_daemon: true
    environment:
      - SERVICES_ENV=dev
    shutdown:
      command: node ./dev/scripts/services.mts stop
      timeout_seconds: 30
    availability:
      restart: exit_on_failure

  app:
    command: mise run --skip-deps dev:app
    availability:
      exit_on_end: true

  docs:
    command: mise run --skip-deps dev:docs
    availability:
      exit_on_end: true

  api:
    command: mise run --skip-deps serve:api:dev
    availability:
      exit_on_end: true
