# Source: rakaly/jomini commit 4461f6e41b28cf7888e2a849858029f9fe4b5a52 (MIT).
# Local change: omitted subunit morale defaults to zero; explicit values are unchanged.
[package]
name = "eu5save"
version = "0.1.0"
authors = ["Nick Babcock <nbabcock19@hotmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/rakaly/jomini"
publish = false
description = "Ergonomically work with Europa Universalis V saves (debug and ironman)"
keywords = ["eu5", "ironman"]
categories = ["parsing"]

[features]
default = []
tsify = ["dep:tsify", "dep:wasm-bindgen"]
zstd_c = ["jomini/zstd_c"]
zstd_rust = ["jomini/zstd_rust"]

[dependencies]
arena-serde = { git = "https://github.com/rakaly/jomini.git" }
bumpalo = { version = "3.20", features = ["collections"] }
jomini = { version = "0.37.1", features = ["envelope"] }
serde = { version = "1.0.195", features = ["derive"] }
thiserror = "2.0.0"
tsify = { version = "0.5.6", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2.118", default-features = false, optional = true }

