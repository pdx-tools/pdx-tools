[package]
name = "wasm-pdx-core"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]

[dependencies]
js-sys = { workspace = true }
rawzip = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
