[package]
name = "pdx-zstd"
version = "0.1.0"
authors = ["Nick Babcock <nbabcock19@hotmail.com>"]
edition = "2024"
publish = false

[lints]
workspace = true

[features]
default = ["zstd_rust"]
zstd_c = ["dep:zstd"]
