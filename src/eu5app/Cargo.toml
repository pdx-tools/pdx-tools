[package]
name = "eu5app"
version = "0.1.0"
edition = "2024"

[features]
game-install = ["dep:image", "dep:regex", "dep:walkdir", "jomini/syntax"]
track-parse = []
tsify = ["dep:tsify", "dep:wasm-bindgen", "campaign-analysis/tsify"]

[dependencies]
bumpalo = { workspace = true }
arena-serde = { workspace = true }
base64 = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
campaign-analysis = { workspace = true }
eu5save = { workspace = true }
highway = { workspace = true }
image = { workspace = true, features = ["png"], optional = true }
jomini = { workspace = true, features = ["zstd_c"] }
pdx-map = { workspace = true, default-features = false }
pdx-zstd = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
rawzip = { workspace = true }
regex = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tsify = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[[test]]
name = "it"
path = "tests/it/main.rs"

[dev-dependencies]
campaign-analysis = { workspace = true }
attohttpc = { workspace = true }
bytemuck = { workspace = true }
eu5app = { path = ".", features = ["game-install", "track-parse"] }
insta = { workspace = true, features = ["glob"] }
rstest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
pdx-save-codec = { workspace = true }
