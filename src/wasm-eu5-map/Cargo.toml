[package]
name = "wasm-eu5-map"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[lib]
doctest = false
crate-type = ["cdylib", "rlib"]

[dependencies]
eu5app = { workspace = true, features = ["tsify"] }
eu5save = { workspace = true, default-features = false }
js-sys = { workspace = true }
pdx-map = { workspace = true, features = ["tracing", "interaction"] }
tsify = { workspace = true, default-features = false, features = ["js"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
wasm-pdx-core = { workspace = true }
wasm-pdx-map = { workspace = true }
web-sys = { workspace = true, features = ["OffscreenCanvas"] }
