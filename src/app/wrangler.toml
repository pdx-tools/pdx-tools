#:schema node_modules/wrangler/config-schema.json
name = "pdx-tools-workers"
compatibility_date = "2026-09-18"
main = "./server.ts"

[assets]
directory = "./build/client"

[observability]
enabled = true
head_sampling_rate = 1

[[analytics_engine_datasets]]
binding = "PDX_METRICS"
dataset = "pdx_metrics"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[hyperdrive]]
binding = "PDX_DB"
id = "52bcc7b655d44776a6e42672fd11b388"
localConnectionString = "postgres://app_user:mercantilismbaby2@localhost:5432/postgres"

[[r2_buckets]]
binding = "SAVE_BUCKET"
bucket_name = "pdx-saves"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pdx-media"

[env.local-secondary]

[env.local-secondary.vars]
SESSION_COOKIE_NAME = "sid_secondary"

[[env.local-secondary.analytics_engine_datasets]]
binding = "PDX_METRICS"
dataset = "pdx_metrics"

[[env.local-secondary.hyperdrive]]
binding = "PDX_DB"
id = "52bcc7b655d44776a6e42672fd11b388"
localConnectionString = "postgres://app_user:mercantilismbaby2@localhost:5532/postgres"

[[env.local-secondary.r2_buckets]]
binding = "SAVE_BUCKET"
bucket_name = "pdx-saves-secondary"

[[env.local-secondary.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pdx-media-secondary"

[env.local-secondary.version_metadata]
binding = "CF_VERSION_METADATA"

[env.test]

[[env.test.analytics_engine_datasets]]
binding = "PDX_METRICS"
dataset = "pdx_metrics"

[[env.test.hyperdrive]]
binding = "PDX_DB"
id = "52bcc7b655d44776a6e42672fd11b388"
localConnectionString = "postgres://app_user:mercantilismbaby@localhost:5433/postgres"

[[env.test.r2_buckets]]
binding = "SAVE_BUCKET"
bucket_name = "pdx-saves-test"

[[env.test.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pdx-media-test"

[env.test.version_metadata]
binding = "CF_VERSION_METADATA"

# Read-only previews of pull requests (see .github/workflows/preview.yml). The
# preview has no R2 or analytics bindings, and its database role can only read.
# Thus code in a pull request cannot change production data.
[env.preview]
name = "pdx-tools-workers-preview"
preview_urls = true
r2_buckets = []
analytics_engine_datasets = []

# The preview workflow uploads the build with this config, not with the config
# from the build (a pull request can change that one). The Vite build ignores
# these rules. They match the rules that the Vite build writes.
[[env.preview.rules]]
type = "ESModule"
globs = ["**/*.js", "**/*.mjs"]

[env.preview.vars]
SAVE_FILE_ORIGIN = "https://pdx.tools"

[[env.preview.hyperdrive]]
binding = "PDX_DB"
id = "f14dd112a27640509aa5e711f63104c0"
localConnectionString = "postgres://app_user:mercantilismbaby2@localhost:5432/postgres"

[env.preview.version_metadata]
binding = "CF_VERSION_METADATA"
