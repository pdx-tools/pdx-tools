#:schema node_modules/wrangler/config-schema.json
name = "pdx-tools-workers"
compatibility_date = "2026-09-18"
main = "./server.ts"

# Upload prebuilt modules with trusted rules instead of the pull request's
# build config. Vite ignores these settings.
no_bundle = true
rules = [{ type = "ESModule", globs = ["**/*.js", "**/*.mjs"] }]

[assets]
directory = "./build/client"

# Database grants restrict previews to reads. Omit R2 and analytics bindings.
# `wrangler types` ignores previews, so generated types still require
# those bindings.
[previews.version_metadata]
binding = "CF_VERSION_METADATA"

[[previews.hyperdrive]]
binding = "PDX_DB"
id = "f14dd112a27640509aa5e711f63104c0"
localConnectionString = "postgres://app_user:mercantilismbaby2@localhost:5432/postgres"

[observability]
enabled = true
head_sampling_rate = 1

[[analytics_engine_datasets]]
binding = "PDX_METRICS"
dataset = "pdx_metrics"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[hyperdrive]]
binding = "PDX_DB"
id = "52bcc7b655d44776a6e42672fd11b388"
localConnectionString = "postgres://app_user:mercantilismbaby2@localhost:5432/postgres"

[[r2_buckets]]
binding = "SAVE_BUCKET"
bucket_name = "pdx-saves"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pdx-media"

[env.local-secondary]

[env.local-secondary.vars]
SESSION_COOKIE_NAME = "sid_secondary"

[[env.local-secondary.analytics_engine_datasets]]
binding = "PDX_METRICS"
dataset = "pdx_metrics"

[[env.local-secondary.hyperdrive]]
binding = "PDX_DB"
id = "52bcc7b655d44776a6e42672fd11b388"
localConnectionString = "postgres://app_user:mercantilismbaby2@localhost:5532/postgres"

[[env.local-secondary.r2_buckets]]
binding = "SAVE_BUCKET"
bucket_name = "pdx-saves-secondary"

[[env.local-secondary.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pdx-media-secondary"

[env.local-secondary.version_metadata]
binding = "CF_VERSION_METADATA"

[env.test]

[[env.test.analytics_engine_datasets]]
binding = "PDX_METRICS"
dataset = "pdx_metrics"

[[env.test.hyperdrive]]
binding = "PDX_DB"
id = "52bcc7b655d44776a6e42672fd11b388"
localConnectionString = "postgres://app_user:mercantilismbaby@localhost:5433/postgres"

[[env.test.r2_buckets]]
binding = "SAVE_BUCKET"
bucket_name = "pdx-saves-test"

[[env.test.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pdx-media-test"

[env.test.version_metadata]
binding = "CF_VERSION_METADATA"
