[package]
name = "wasm-compress"
version = "0.1.0"
authors = ["Nick Babcock <nbabcock19@hotmail.com>"]
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
doctest = false
crate-type = ["cdylib", "rlib"]

[dependencies]
jomini = { workspace = true, features = ["zstd_c"] }
js-sys = { workspace = true }
pdx-save-codec = { workspace = true }
serde = { features = ["derive"] , workspace = true }
tsify = { default-features = false, features = ["js"] , workspace = true }
wasm-bindgen = { workspace = true }
wasm-pdx-core = { workspace = true }
web-sys = { workspace = true, features = ["Blob"] }
