[package]
name = "wasm-compress"
version = "0.1.0"
authors = ["Nick Babcock <nbabcock19@hotmail.com>"]
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["zstd_rust"]
zstd_c = ["pdx-save-codec/zstd_c"]
zstd_rust = ["pdx-save-codec/zstd_rust"]
zstd_c_fat_lto = ["pdx-save-codec/zstd_c_fat_lto"]

[dependencies]
js-sys = { workspace = true }
pdx-save-codec = { workspace = true }
serde = { features = ["derive"] , workspace = true }
tsify = { default-features = false, features = ["js"] , workspace = true }
wasm-bindgen = { workspace = true }
